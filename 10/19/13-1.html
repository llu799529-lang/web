<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>13-1 · Font Awesome 字体图标</title>
<link rel="stylesheet" href="cdn/fontawesome/css/all.min.css">
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --text: #e2e8f0;
    --muted: #94a3b8; --border: #334155; --accent: #5b8def;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 32px 40px; text-align: center; max-width: 720px;
  }
  h1 { font-size: 22px; }
  .sub { color: var(--muted); font-size: 13px; margin: 6px 0 28px; }
  .grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
  }
  .item {
    background: #0f172a; border: 1px solid var(--border);
    border-radius: 12px; padding: 20px 8px; transition: transform .15s, border-color .15s;
  }
  .item:hover { transform: translateY(-3px); border-color: var(--accent); }
  .item i { font-size: 28px; color: var(--accent); }
  .item span { display: block; margin-top: 10px; font-size: 11px; color: var(--muted); font-family: Consolas, monospace; }
  .tag { display:inline-block; margin-top:24px; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <h1>Font Awesome · 字体图标方式</h1>
    <div class="sub">通过 &lt;i class="fa-solid fa-xxx"&gt; 引用，本质是字体（webfont）</div>
    <div class="grid">
      <div class="item"><i class="fa-solid fa-house"></i><span>house</span></div>
      <div class="item"><i class="fa-solid fa-user"></i><span>user</span></div>
      <div class="item"><i class="fa-solid fa-gear"></i><span>gear</span></div>
      <div class="item"><i class="fa-solid fa-heart"></i><span>heart</span></div>
      <div class="item"><i class="fa-solid fa-star"></i><span>star</span></div>
      <div class="item"><i class="fa-solid fa-magnifying-glass"></i><span>search</span></div>
      <div class="item"><i class="fa-solid fa-envelope"></i><span>envelope</span></div>
      <div class="item"><i class="fa-solid fa-phone"></i><span>phone</span></div>
      <div class="item"><i class="fa-solid fa-camera"></i><span>camera</span></div>
      <div class="item"><i class="fa-solid fa-music"></i><span>music</span></div>
      <div class="item"><i class="fa-solid fa-film"></i><span>film</span></div>
      <div class="item"><i class="fa-solid fa-car"></i><span>car</span></div>
    </div>
    <div class="tag">本地 cdn：cdn/fontawesome/css/all.min.css + webfonts/*.woff2</div>
  </div>
</body>
</html>
