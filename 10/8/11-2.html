<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>CSS3 3D 动画</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    color: #fff;
}

#luo_title {
    font-size: 36px;
    margin-bottom: 40px;
    letter-spacing: 6px;
    text-shadow: 0 4px 12px rgba(0,0,0,.5);
}

#luo_stage {
    display: flex;
    flex-wrap: wrap;
    gap: 50px;
    justify-content: center;
    perspective: 1000px;
}

.luo_card {
    width: 180px;
    text-align: center;
}

.luo_card p {
    margin-top: 18px;
    font-size: 15px;
    letter-spacing: 2px;
    color: #b0e0ff;
}

/* 1. 旋转立方体 */
.luo_cube-box {
    width: 100px;
    height: 100px;
    margin: 0 auto;
    position: relative;
    transform-style: preserve-3d;
    animation: luo-spin 6s linear infinite;
}
.luo_face {
    position: absolute;
    width: 100px;
    height: 100px;
    line-height: 100px;
    font-size: 20px;
    font-weight: bold;
    color: #fff;
    border: 2px solid rgba(255,255,255,.6);
}
.luo-front  { background: rgba(255,87,34,.8);  transform: translateZ(50px); }
.luo-back   { background: rgba(33,150,243,.8); transform: rotateY(180deg) translateZ(50px); }
.luo-right  { background: rgba(76,175,80,.8);  transform: rotateY(90deg) translateZ(50px); }
.luo-left   { background: rgba(255,193,7,.85);  transform: rotateY(-90deg) translateZ(50px); }
.luo-top    { background: rgba(156,39,176,.8);  transform: rotateX(90deg) translateZ(50px); }
.luo-bottom { background: rgba(0,150,136,.8);  transform: rotateX(-90deg) translateZ(50px); }
@keyframes luo-spin {
    from { transform: rotateX(0) rotateY(0); }
    to   { transform: rotateX(360deg) rotateY(360deg); }
}

/* 2. 翻牌 */
.luo_flip-box {
    width: 100px;
    height: 100px;
    margin: 0 auto;
    position: relative;
    transform-style: preserve-3d;
    animation: luo-flip 4s ease-in-out infinite;
}
.luo_flip-face {
    position: absolute;
    width: 100px;
    height: 100px;
    line-height: 100px;
    font-size: 16px;
    font-weight: bold;
    border: 2px solid rgba(255,255,255,.6);
    backface-visibility: hidden;
}
.luo_flip-front { background: #e91e63; transform: translateZ(1px); }
.luo_flip-back  { background: #3f51b5; transform: rotateY(180deg) translateZ(1px); }
@keyframes luo-flip {
    0%, 40%  { transform: rotateY(0); }
    60%, 100% { transform: rotateY(180deg); }
}

/* 3. 3D 弹跳球 */
.luo_ball-scene {
    width: 100px;
    height: 100px;
    margin: 0 auto;
    transform-style: preserve-3d;
    animation: luo-bounce 1.2s ease-in-out infinite;
}
.luo_ball {
    width: 70px;
    height: 70px;
    margin: 15px auto 0;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ffd54f, #ff8f00);
    box-shadow: 0 10px 20px rgba(0,0,0,.4);
}
@keyframes luo-bounce {
    0%, 100% { transform: rotateX(0) translateY(0); }
    50%      { transform: rotateX(180deg) translateY(-25px); }
}

/* 4. 3D 转盘圆环 */
.luo_ring-scene {
    width: 110px;
    height: 110px;
    margin: 0 auto;
    position: relative;
    transform-style: preserve-3d;
    transform: rotateX(60deg);
    animation: luo-ring-spin 5s linear infinite;
}
.luo_ring-item {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 24px;
    height: 24px;
    margin: -12px 0 0 -12px;
    border-radius: 50%;
    background: #00e5ff;
    box-shadow: 0 0 12px #00e5ff;
}
@keyframes luo-ring-spin {
    from { transform: rotateX(60deg) rotateZ(0); }
    to   { transform: rotateX(60deg) rotateZ(360deg); }
}

/* 5. 3D 卡片悬浮透视 */
.luo_tilt {
    width: 100px;
    height: 100px;
    margin: 0 auto;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border: 2px solid rgba(255,255,255,.5);
    line-height: 100px;
    font-size: 18px;
    font-weight: bold;
    transition: transform .3s;
    cursor: pointer;
}
.luo_tilt:hover {
    transform: rotateY(25deg) rotateX(15deg) scale(1.1);
}
</style>
</head>
<body>

<div id="luo_title">CSS3 3D 动画</div>

<div idluo_stage">

    <div class="luo_card">
        <div class="luo_cube-box">
            <div class="luo_face luo-front">前</div>
            <div class="luo_face luo-back">后</div>
            <div class="luo_face luo-right">右</div>
            <div class="luo_face luo-left">左</div>
            <div class="luo_face luo_top">顶</div>
            <div class="luo_face luo_bottom">底</div>
        </div>
        <p>3D 旋转立方体</p>
    </div>

    <div class="luo_card">
        <div class="luo_flip-box">
            <div class="luo_flip-face luo_flip-front">正面</div>
            <div class="luo_flip-face luo_flip-back">背面</div>
        </div>
        <p>3D 翻牌</p>
    </div>

    <div class="luo_card">
        <div class="luo_ball-scene">
            <div class="luo_ball"></div>
        </div>
        <p>3D 弹跳</p>
    </div>

    <div class="luo_card">
        <div class="luo_ring-scene">
            <div class="luo_ring-item" style="transform: rotate(0deg)   translateX(45px);"></div>
            <div class="luo_ring-item" style="transform: rotate(60deg)  translateX(45px); background:#ff4081;box-shadow:0 0 12px #ff4081;"></div>
            <div class="luo_ring-item" style="transform: rotate(120deg) translateX(45px); background:#76ff03;box-shadow:0 0 12px #76ff03;"></div>
            <div class="luo_ring-item" style="transform: rotate(180deg) translateX(45px); background:#ffea00;box-shadow:0 0 12px #ffea00;"></div>
            <div class="luo_ring-item" style="transform: rotate(240deg) translateX(45px); background:#d500f9;box-shadow:0 0 12px #d500f9;"></div>
            <div class="luo_ring-item" style="transform: rotate(300deg) translateX(45px); background:#ff6d00;box-shadow:0 0 12px #ff6d00;"></div>
        </div>
        <p>3D 旋转圆环</p>
    </div>

    <div class="luo_card">
        <div class="luo_tilt">HOVER</div>
        <p>3D 透视悬浮</p>
    </div>

</div>

</body>
</html>
