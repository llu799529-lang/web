<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Flex布局四组示例 + 三个长方形框带文字</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            gap:20px;
            padding:20px;
            flex-wrap: wrap;
        }
        /* 外层画板容器 */
        .wrap{
            width: 420px;
            height: 480px;
            border:1px solid #999;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* 第1个：单个方块居中 */
        .box1{
            width:120px;
            height:160px;
            background:#4285F4;
            border:1px solid #222;
        }
        /* 第2个容器：纵向排列2个矩形 */
        .wrap2{
            flex-direction: column;
            gap:15px;
        }
        .box2-1{
            width:180px;
            height:100px;
            background:#34A853;
            border:1px solid #222;
        }
        .box2-2{
            width:180px;
            height:100px;
            background:#FBBC05;
            border:1px solid #222;
        }
        /* ==========第三个容器========== */
        .wrap3{
            flex-direction: column;
            gap:15px;
        }
        .box3-1{
            width:140px;
            height:100px;
            background:#EA4335;
            border:1px solid #222;
        }
        .box3-2{
            width:140px;
            height:100px;
            background:#7B61FF;
            border:1px solid #222;
        }
        .box3-3{
            width:140px;
            height:100px;
            background:#17A2B8;
            border:1px solid #222;
        }
        .box3-4{
            width:140px;
            height:100px;
            background:#FF7D00;
            border:1px solid #222;
        }
        /* 第4个容器：上通栏，下面两个并排 */
        .wrap4{
            flex-direction: column;
            gap:15px;
        }
        .top-box{
            width:280px;
            height:100px;
            background:#6F42C1;
            border:1px solid #222;
        }
        .bottom-group{
            display:flex;
            gap:15px;
        }
        .box4-1{
            width:130px;
            height:130px;
            background:#20C997;
            border:1px solid #222;
        }
        .box4-2{
            width:130px;
            height:130px;
            background:#DC3545;
            border:1px solid #222;
        }

        /* ==========新增：3个空心长方形，内部文字，flex横向排列 ========== */
        .three-box{
            width:420px;
            height:180px;
            border:1px solid #999;
            display:flex;
            justify-content:center;
            align-items:center;
            gap:16px;
        }
        .item-box{
            width:110px;
            height:80px;
            border:2px solid #333;
            /* 空心，不要背景色 */
            background:none;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:18px;
        }
    </style>
</head>
<body>
    <!-- 1.单个方块 -->
    <div class="wrap">
        <div class="box1"></div>
    </div>
    <!-- 2.上下两个 -->
    <div class="wrap wrap2">
        <div class="box2-1"></div>
        <div class="box2-2"></div>
    </div>
    <!-- 3.纵向4个矩形垂直排列 -->
    <div class="wrap wrap3">
        <div class="box3-1"></div>
        <div class="box3-2"></div>
        <div class="box3-3"></div>
        <div class="box3-4"></div>
    </div>
    <!-- 4.上通栏，下两个并排 -->
    <div class="wrap wrap4">
        <div class="top-box"></div>
        <div class="bottom-group">
            <div class="box4-1"></div>
            <div class="box4-2"></div>
        </div>
    </div>

    <!-- 新增：三个空心长方形框，里面有文字 -->
    <div class="three-box">
        <div class="item-box">选项A</div>
        <div class="item-box">选项B</div>
        <div class="item-box">选项C</div>
    </div>
</body>
</html>
