<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>transition过渡 卡片放大效果</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            padding: 30px;
            background-color: #f5f5f5;
        }
        h2 {
            max-width: 1000px;
            margin: 0 auto 25px;
            font-size: 24px;
            font-weight: normal;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 2px 8px #00000022;
            transition: transform 0.3s ease;
        }
        .card img {
            width: 100%;
            display: block;
        }
        .card .title {
            background: rgba(0,0,0,0.6);
            color: white;
            text-align: center;
            padding: 6px 0;
        }
        .card:hover {
            transform: scale(1.08);
        }
    </style>
</head>
<body>
    <h2>真实的transition过渡</h2>
    <div class="container">
        <div class="card">
            <img src="1.png" alt="图片">
            <div class="title">yabo的标题</div>
        </div>
        <div class="card">
            <img src="2.png" alt="图片">
            <div class="title">yabo的标题</div>
        </div>
        <div class="card">
            <img src="1.png" alt="图片">
            <div class="title">yabo的标题</div>
        </div>
        <div class="card">
            <img src="2.png" alt="图片">
            <div class="title">yabo的标题</div>
        </div>
        <div class="card">
            <img src="1.png" alt="图片">
            <div class="title">yabo的标题</div>
        </div>
        <div class="card">
            <img src="2.png" alt="图片">
            <div class="title">yabo的标题</div>
        </div>
        <div class="card">
            <img src="1.png" alt="图片">
            <div class="title">yabo的标题</div>
        </div>
        <div class="card">
            <img src="2.png" alt="图片">
            <div class="title">yabo的标题</div>
        </div>
        <div class="card">
            <img src="1.png" alt="图片">
            <div class="title">yabo的标题</div>
        </div>
    </div>
</body>
</html>
