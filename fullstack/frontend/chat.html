<!DOCTYPE html>
<!--
    姓名：罗亚博 | 学号：409
    时间：2026-11-12 | 大模型：DeepSeek-V4.1-Flash
    功能名称：AI 聊天页（多轮会话、历史落库、上下文压缩，提示词与返回数据输出到控制台）
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 聊天 · 罗亚博 409</title>
    <link rel="stylesheet" href="css/luo_base.css">
    <link rel="stylesheet" href="css/luo_chat.css">
</head>
<body>
<canvas id="luoCanvas" class="luo_canvas"></canvas>

<div class="luo_page luo_page_chat">
    <header class="luo_head">
        <h1 class="luo_title">AI 聊天</h1>
        <p class="luo_sub">
            多轮对话，消息存 MySQL，超出 12 条后自动把早期对话压成摘要。
            前端只调 <code>POST /api/chat</code>，密钥留在后端。
        </p>

        <dl class="luo_meta">
            <div><dt>姓名</dt><dd>罗亚博</dd></div>
            <div><dt>学号</dt><dd>409</dd></div>
            <div><dt>模型</dt><dd>DeepSeek-V4-Flash</dd></div>
            <div><dt>接口</dt><dd>/api/chat</dd></div>
        </dl>
    </header>

    <main>
        <div class="luo_app">
            <aside class="luo_side">
                <div class="luo_side_head">
                    <span>会话</span>
                    <button type="button" class="luo_mini" id="luoNewBtn">新建</button>
                </div>
                <div class="luo_sessions" id="luoSessions">
                    <p class="luo_side_empty">加载中…</p>
                </div>
            </aside>

            <section class="luo_main">
                <div class="luo_main_head">
                    <b id="luoChatTitle">正在加载会话…</b>
                    <span id="luoChatMeta"></span>
                </div>

                <div class="luo_msgs" id="luoMsgs"></div>

                <div class="luo_composer">
                    <textarea id="luoInput" rows="2" placeholder="Enter 发送，Shift + Enter 换行"></textarea>
                    <div class="luo_bar">
                        <span class="luo_tip">F12 控制台可看到发给模型的 messages 与返回的 JSON</span>
                        <button type="button" class="luo_btn" id="luoStopBtn" hidden>停止</button>
                        <button type="button" class="luo_btn luo_btn_primary" id="luoSendBtn">发送</button>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <footer class="luo_foot">
        罗亚博 · 学号 409 · 计算机 24004 · 2026-11-12 · <a href="index.html">返回首页</a>
    </footer>
</div>

<script src="js/luo_canvas.js"></script>
<script src="js/luo_chat.js"></script>
</body>
</html>
