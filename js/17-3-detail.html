<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17-3 商品详情</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <!--
      作者：lyb
      建立时间：2026-11-02
      使用的大模型：DeepSeek-V4.1-Flash
      功能名称：商品详情页（读取地址栏 id 参数，fetch 请求 /products/{id} 渲染单个商品，可切换上一个 / 下一个）
    -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            padding: 40px 24px 56px;
            background: #f5f6f8;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #1f2329;
        }

        .wrap { max-width: 1060px; margin: 0 auto; }

        .topbar {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border: 1px solid #e5e6eb;
            border-radius: 9px;
            background: #fff;
            font-size: 13px;
            color: #3d4653;
            text-decoration: none;
            transition: all .16s;
        }

        .back:hover { background: #1f2329; border-color: #1f2329; color: #fff; }

        .switchid { margin-left: auto; display: flex; gap: 8px; }

        .switchid a {
            padding: 7px 14px;
            border: 1px solid #e5e6eb;
            border-radius: 9px;
            background: #fff;
            font-size: 12.5px;
            font-family: Consolas, monospace;
            color: #3d4653;
            text-decoration: none;
            transition: all .16s;
        }

        .switchid a:hover { border-color: #1d6fe0; color: #1d6fe0; }

        h1 { margin-top: 18px; font-size: 24px; font-weight: 600; letter-spacing: .5px; }

        .sub { margin-top: 9px; font-size: 13.5px; line-height: 1.9; color: #646a73; }

        .sub code { font-family: Consolas, monospace; font-size: 12.5px; background: #eceef2; padding: 1px 5px; border-radius: 4px; }

        /* ---------- 请求信息 ---------- */
        .req {
            margin-top: 20px;
            padding: 14px 16px;
            background: #fff;
            border: 1px solid #e5e6eb;
            border-radius: 12px;
        }

        .params {
            display: grid;
            grid-template-columns: auto auto 1fr;
            gap: 6px 30px;
            align-items: start;
            justify-content: start;
        }

        .param { align-self: start; }

        .param .k { font-size: 11.5px; color: #8a9099; }

        .param .v {
            margin-top: 4px;
            font-family: Consolas, monospace;
            font-size: 13px;
            color: #1f2329;
        }

        .param .v.pidval { font-size: 20px; font-weight: 600; color: #1d6fe0; }

        .url {
            margin-top: 12px;
            padding: 9px 12px;
            border-radius: 8px;
            background: #f7f8fa;
            border: 1px solid #eef0f3;
            font-family: Consolas, monospace;
            font-size: 12px;
            color: #646a73;
            word-break: break-all;
        }

        .url b { color: #1d6fe0; font-weight: 400; }

        .stat {
            margin-top: 10px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            font-family: Consolas, monospace;
            font-size: 12px;
            color: #8a9099;
        }

        .stat b { color: #3d4653; }
        .stat .ok { color: #0b8a5c; }

        /* ---------- 详情主体 ---------- */
        .card {
            margin-top: 16px;
            background: #fff;
            border: 1px solid #e5e6eb;
            border-radius: 12px;
            padding: 22px 24px 24px;
        }

        .main {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 30px;
        }

        .big {
            width: 100%;
            height: 320px;
            border: 1px solid #eef0f3;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
        }

        .big img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .thumbs { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

        .thumbs img {
            width: 56px;
            height: 56px;
            object-fit: cover;
            border: 2px solid transparent;
            border-radius: 8px;
            background: #f7f8fa;
            cursor: pointer;
            transition: border-color .15s;
        }

        .thumbs img.on { border-color: #1d6fe0; }

        .info h2 { font-size: 22px; font-weight: 600; line-height: 1.45; }

        .brandline { margin-top: 8px; font-size: 12.5px; color: #8a9099; }

        .priceline {
            margin-top: 16px;
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
        }

        .priceline .p { font-size: 28px; font-weight: 600; color: #e8720c; font-family: Arial, sans-serif; }
        .priceline .old { font-size: 14px; color: #b0b6bd; text-decoration: line-through; font-family: Arial, sans-serif; }
        .priceline .off { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: #fff1e6; color: #e8720c; }

        .desc { margin-top: 16px; font-size: 13.5px; line-height: 1.95; color: #4a5058; }

        .specs {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .spec { padding: 11px 13px; background: #f9fafb; border: 1px solid #f0f1f3; border-radius: 9px; }
        .spec .k { font-size: 11.5px; color: #8a9099; }
        .spec .v { margin-top: 5px; font-size: 13px; font-weight: 600; color: #1f2329; }

        .tags { margin-top: 16px; display: flex; gap: 7px; flex-wrap: wrap; }

        .tags em {
            font-style: normal;
            font-size: 11.5px;
            padding: 3px 9px;
            border-radius: 999px;
            background: #eef1f6;
            color: #3d4653;
        }

        /* ---------- 状态 ---------- */
        .skeleton { height: 380px; border-radius: 12px; background: #fff; border: 1px solid #e5e6eb; position: relative; overflow: hidden; }

        .skeleton::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(29, 111, 224, .07), transparent);
            transform: translateX(-100%);
            animation: sweep 1.1s infinite;
        }

        @keyframes sweep { to { transform: translateX(100%); } }

        .empty {
            margin-top: 16px;
            padding: 40px 34px;
            text-align: center;
            background: #fff;
            border: 1px dashed #d8dce2;
            border-radius: 12px;
            font-size: 13.5px;
            line-height: 2;
            color: #8a9099;
        }

        .empty b { display: block; font-size: 15px; color: #b2404a; margin-bottom: 6px; }

        .empty a {
            display: inline-block;
            margin-top: 16px;
            padding: 8px 18px;
            border-radius: 9px;
            background: #1d6fe0;
            color: #fff;
            font-size: 13px;
            text-decoration: none;
        }

        details {
            margin-top: 18px;
            background: #fff;
            border: 1px solid #e5e6eb;
            border-radius: 12px;
            padding: 14px 18px;
        }

        summary { font-size: 13.5px; font-weight: 600; color: #3d4653; cursor: pointer; list-style: none; }
        summary::-webkit-details-marker { display: none; }
        summary::before { content: "▸ "; color: #1d6fe0; }
        details[open] summary::before { content: "▾ "; }

        details pre {
            margin-top: 12px;
            max-height: 380px;
            overflow: auto;
            padding: 14px 16px;
            border-radius: 9px;
            background: #fbfcfd;
            border: 1px solid #eef0f3;
        }

        details code {
            font-family: Consolas, "SFMono-Regular", Menlo, monospace;
            font-size: 12.5px;
            line-height: 1.8;
            white-space: pre;
            color: #24292f;
        }

        .j-key { color: #1d6fe0; }
        .j-str { color: #0a8a45; }
        .j-num { color: #e8720c; }
        .j-bool, .j-null { color: #a626a4; }

        @media (max-width: 900px) {
            .main { grid-template-columns: 1fr; }
            .specs { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="topbar">
        <a class="back" href="17-3.html">← 返回列表</a>
        <div class="switchid" id="switchid"></div>
    </div>

    <h1>商品详情</h1>
    <p class="sub">
        这一页的编号来自地址栏：<code>17-3-detail.html?id=1</code>。页面用 <code>new URLSearchParams(location.search)</code>
        取出 id，再 <b>fetch</b> 请求 <code>dummyjson.com/products/{id}</code>，所以换一个 id 就是另一个商品，列表页的数据一点都没带过来。
    </p>

    <div class="req">
        <div class="params">
            <div class="param"><div class="k">地址栏参数 id</div><div class="v pidval" id="pid">—</div></div>
            <div class="param"><div class="k">当前请求</div><div class="v" id="purl">—</div></div>
        </div>
        <div class="url" id="url">请求地址：<b>—</b></div>
        <div class="stat" id="stat">等待请求…</div>
    </div>

    <div id="body">
        <div class="skeleton" style="margin-top:16px"></div>
    </div>

    <details>
        <summary>查看接口返回的原始 JSON</summary>
        <pre><code id="raw">（请求后显示）</code></pre>
    </details>
</div>

<script>
    var BASE = 'https://dummyjson.com/products/';

    var body = document.getElementById('body');
    var stat = document.getElementById('stat');
    var raw = document.getElementById('raw');
    var urlBox = document.getElementById('url');
    var pidBox = document.getElementById('pid');
    var purlBox = document.getElementById('purl');
    var switchBox = document.getElementById('switchid');

    function escapeHtml(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function highlight(json) {
        return escapeHtml(json).replace(
            /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false)\b|\bnull\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
            function (m) {
                var cls = 'j-num';
                if (/^"/.test(m)) cls = /:$/.test(m) ? 'j-key' : 'j-str';
                else if (/true|false/.test(m)) cls = 'j-bool';
                else if (/null/.test(m)) cls = 'j-null';
                return '<span class="' + cls + '">' + m + '</span>';
            }
        );
    }

    /* ---------- 从地址栏取 id ---------- */
    var params = new URLSearchParams(location.search);
    var id = params.get('id') || '1';
    var numId = parseInt(id, 10);

    pidBox.textContent = id;
    purlBox.textContent = '/products/' + id;

    var prev = numId > 1 ? numId - 1 : 1;
    var next = numId + 1;
    switchBox.innerHTML =
        '<a href="17-3-detail.html?id=' + prev + '">← 上一个 id=' + prev + '</a>' +
        '<a href="17-3-detail.html?id=' + next + '">下一个 id=' + next + ' →</a>';

    function fail(msg) {
        body.innerHTML = '<div class="empty"><b>' + escapeHtml(msg) + '</b>' +
            '这个编号可能不存在（dummyjson 一共 194 个商品）。<br>' +
            '换一个 id 试试，或者回到列表重新点。' +
            '<br><a href="17-3.html">← 返回商品列表</a></div>';
        stat.innerHTML = '<span>状态 <b style="color:#b2404a">失败</b></span>';
        raw.textContent = '（没有拿到数据）';
    }

    if (isNaN(numId) || numId < 1) {
        fail('id 参数不合法：' + id);
    } else {
        var url = BASE + numId;
        urlBox.innerHTML = '请求地址：<b>' + url + '</b>';
        stat.innerHTML = '<span>状态 <b>请求中…</b></span>';
        raw.textContent = '（请求中）';

        var t0 = performance.now();

        fetch(url, { headers: { 'Accept': 'application/json' } })
            .then(function (res) {
                if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);
                return res.json();
            })
            .then(function (p) {
                var ms = Math.round(performance.now() - t0);
                var imgs = (p.images && p.images.length) ? p.images : [p.thumbnail || ''];
                var oldPrice = p.discountPercentage
                    ? '$' + (p.price / (1 - p.discountPercentage / 100)).toFixed(2)
                    : '';

                var thumbs = imgs.slice(0, 4).map(function (s, i) {
                    return '<img src="' + s + '" data-src="' + s + '" class="' + (i === 0 ? 'on' : '') + '" alt="">';
                }).join('');

                var specs = [];
                if (p.brand) specs.push(['品牌', p.brand]);
                if (p.category) specs.push(['分类', p.category]);
                if (p.stock !== undefined) specs.push(['库存', p.stock + ' 件']);
                if (p.sku) specs.push(['SKU', p.sku]);
                if (p.warrantyInformation) specs.push(['保修', p.warrantyInformation]);
                if (p.shippingInformation) specs.push(['配送', p.shippingInformation]);

                body.innerHTML =
                    '<div class="card">' +
                    '<div class="main">' +
                    '<div>' +
                    '<div class="big"><img id="bigimg" src="' + imgs[0] + '" alt=""></div>' +
                    '<div class="thumbs" id="thumbs">' + thumbs + '</div>' +
                    '</div>' +
                    '<div class="info">' +
                    '<h2>' + escapeHtml(p.title) + '</h2>' +
                    '<div class="brandline">' + escapeHtml(p.brand || '—') + '　·　商品 ID ' + p.id + '</div>' +
                    '<div class="priceline">' +
                    '<span class="p">$' + p.price + '</span>' +
                    (oldPrice ? '<span class="old">' + oldPrice + '</span>' : '') +
                    (p.discountPercentage ? '<span class="off">-' + p.discountPercentage.toFixed(1) + '%</span>' : '') +
                    '<span style="color:#f5a623;font-size:13px">★ ' + (p.rating || '-') + '</span>' +
                    '</div>' +
                    '<p class="desc">' + escapeHtml(p.description || '') + '</p>' +
                    '<div class="specs">' + specs.map(function (s) {
                        return '<div class="spec"><div class="k">' + s[0] + '</div><div class="v">' + escapeHtml(s[1]) + '</div></div>';
                    }).join('') + '</div>' +
                    (p.tags && p.tags.length
                        ? '<div class="tags">' + p.tags.map(function (t) { return '<em>' + escapeHtml(t) + '</em>'; }).join('') + '</div>'
                        : '') +
                    '</div></div></div>';

                document.getElementById('thumbs').addEventListener('click', function (ev) {
                    var t = ev.target;
                    if (t.tagName !== 'IMG') return;
                    document.getElementById('bigimg').src = t.dataset.src;
                    document.querySelectorAll('#thumbs img').forEach(function (x) { x.classList.remove('on'); });
                    t.classList.add('on');
                });

                stat.innerHTML =
                    '<span>状态 <b class="ok">200 OK</b></span>' +
                    '<span>耗时 <b>' + ms + ' ms</b></span>' +
                    '<span>拿到 <b>' + Object.keys(p).length + '</b> 个字段</span>';

                raw.innerHTML = highlight(JSON.stringify(p, null, 2));
            })
            .catch(function (err) {
                fail('详情请求失败：' + err.message);
            });
    }
</script>
</body>
</html>
