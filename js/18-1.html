<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>18-1 Canvas 粒子网络动画</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <!--
      作者：lyb
      建立时间：2026-11-05
      使用的大模型：DeepSeek-V4.1-Flash
      功能名称：Canvas 粒子网络动画（粒子漂浮 + 就近连线 + 鼠标斥力 + 实时参数调节）
    -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; overflow: hidden; }

        body {
            background: #070a12;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #e8edf5;
        }

        #c {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: crosshair;
        }

        /* ---------- 左上角标题 ---------- */
        .title {
            position: fixed;
            left: 28px;
            top: 26px;
            pointer-events: none;
        }

        .title h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: .6px;
            text-shadow: 0 2px 16px rgba(0, 0, 0, .8);
        }

        .title p {
            margin-top: 7px;
            font-size: 12.5px;
            line-height: 1.7;
            color: #7b8698;
            max-width: 320px;
        }

        /* ---------- 控制面板 ---------- */
        .panel {
            position: fixed;
            right: 24px;
            top: 24px;
            width: 226px;
            padding: 16px 18px 14px;
            background: rgba(18, 24, 38, .72);
            border: 1px solid rgba(120, 160, 255, .18);
            border-radius: 14px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .panel h2 {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #6b7a92;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        .field { margin-bottom: 13px; }

        .field .head {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #9aa7bd;
            margin-bottom: 6px;
        }

        .field .head b {
            font-family: Consolas, monospace;
            color: #4fd1ff;
            font-weight: 600;
        }

        input[type="range"] {
            width: 100%;
            height: 3px;
            border-radius: 99px;
            background: rgba(120, 160, 255, .22);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #4fd1ff;
            box-shadow: 0 0 10px rgba(79, 209, 255, .7);
            cursor: pointer;
        }

        .btns { display: flex; gap: 8px; margin-top: 16px; }

        .btns button {
            flex: 1;
            padding: 8px 0;
            border: 1px solid rgba(120, 160, 255, .25);
            border-radius: 9px;
            background: rgba(79, 209, 255, .08);
            color: #9ad8f0;
            font-size: 12.5px;
            cursor: pointer;
            transition: all .16s;
        }

        .btns button:hover {
            background: rgba(79, 209, 255, .2);
            border-color: rgba(79, 209, 255, .5);
            color: #fff;
        }

        .btns button.on {
            background: rgba(79, 209, 255, .85);
            border-color: #4fd1ff;
            color: #06121c;
            font-weight: 600;
        }

        /* ---------- 左下角统计 ---------- */
        .stat {
            position: fixed;
            left: 28px;
            bottom: 24px;
            display: flex;
            gap: 22px;
            font-family: Consolas, "SFMono-Regular", Menlo, monospace;
            font-size: 11.5px;
            color: #5d6b82;
        }

        .stat b { color: #4fd1ff; font-weight: 600; }

        /* ---------- 右下角提示 ---------- */
        .hint {
            position: fixed;
            right: 26px;
            bottom: 24px;
            font-size: 11.5px;
            color: #4a5568;
            text-align: right;
            line-height: 1.8;
        }

        .hint a {
            color: #6b8fc4;
            text-decoration: none;
            border-bottom: 1px dotted rgba(107, 143, 196, .5);
        }

        .hint a:hover { color: #4fd1ff; }

        @media (max-width: 760px) {
            .panel { display: none; }
            .title p { display: none; }
        }
    </style>
</head>
<body>
<canvas id="c"></canvas>

<div class="title">
    <h1>Canvas 粒子网络</h1>
    <p>每个点是一个粒子，距离够近就连一条线。整幅画面每帧由 canvas 重绘，鼠标靠近会把粒子推开。</p>
</div>

<div class="panel">
    <h2>参数</h2>

    <div class="field">
        <div class="head"><span>粒子数量</span><b id="vCount">140</b></div>
        <input type="range" id="rCount" min="30" max="320" step="10" value="140">
    </div>

    <div class="field">
        <div class="head"><span>连线距离</span><b id="vDist">130</b></div>
        <input type="range" id="rDist" min="60" max="240" step="10" value="130">
    </div>

    <div class="field">
        <div class="head"><span>运动速度</span><b id="vSpeed">0.6</b></div>
        <input type="range" id="rSpeed" min="0" max="25" step="1" value="6">
    </div>

    <div class="field">
        <div class="head"><span>鼠标斥力</span><b id="vForce">90</b></div>
        <input type="range" id="rForce" min="0" max="200" step="10" value="90">
    </div>

    <div class="btns">
        <button id="btnPause">暂停</button>
        <button id="btnReset">重置</button>
    </div>
</div>

<div class="stat">
    <span>FPS <b id="fps">--</b></span>
    <span>粒子 <b id="pc">0</b></span>
    <span>连线 <b id="lc">0</b></span>
</div>

<div class="hint">
    纯原生 canvas 绘制，无任何依赖<br>
    <a href="https://github.com/llu799529-lang/html-homework" target="_blank" rel="noopener">GitHub 仓库</a>
</div>

<script>
(function () {
    var cv = document.getElementById('c');
    var ctx = cv.getContext('2d');

    var W = 0, H = 0, DPR = 1;
    var particles = [];
    var mouse = { x: -9999, y: -9999, active: false };

    /* 可调参数 */
    var cfg = {
        count: 140,
        linkDist: 130,
        speed: 0.6,
        force: 90,
        paused: false
    };

    /* ---------- 尺寸与高清屏适配 ---------- */
    function resize() {
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        cv.width = Math.floor(W * DPR);
        cv.height = Math.floor(H * DPR);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);   /* 之后都用 CSS 像素坐标画 */
    }

    /* ---------- 粒子 ---------- */
    function makeParticle() {
        var a = Math.random() * Math.PI * 2;
        var s = (0.3 + Math.random() * 0.7) * cfg.speed;
        return {
            x: Math.random() * W,
            y: Math.random() * H,
            vx: Math.cos(a) * s,
            vy: Math.sin(a) * s,
            r: 0.9 + Math.random() * 1.7,
            hue: Math.random() < 0.18 ? 190 : 205,   /* 少数偏青色点缀 */
            alpha: 0.35 + Math.random() * 0.55
        };
    }

    function initParticles() {
        particles = [];
        for (var i = 0; i < cfg.count; i++) particles.push(makeParticle());
        document.getElementById('pc').textContent = particles.length;
    }

    /* ---------- 每帧 ---------- */
    var lastT = 0, fpsAcc = 0, fpsFrames = 0;

    function frame(t) {
        var dt = lastT ? Math.min(t - lastT, 50) : 16;
        lastT = t;

        /* FPS 统计 */
        fpsAcc += dt;
        fpsFrames++;
        if (fpsAcc >= 500) {
            document.getElementById('fps').textContent = Math.round(1000 / (fpsAcc / fpsFrames));
            fpsAcc = 0;
            fpsFrames = 0;
        }

        ctx.clearRect(0, 0, W, H);

        /* 背景径向光晕，让画面不闷 */
        var g = ctx.createRadialGradient(W * 0.5, H * 0.45, 0, W * 0.5, H * 0.45, Math.max(W, H) * 0.7);
        g.addColorStop(0, 'rgba(23, 42, 74, 0.55)');
        g.addColorStop(1, 'rgba(7, 10, 18, 0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);

        var i, j, p, q, dx, dy, d;

        /* 1. 更新位置 + 鼠标斥力 */
        for (i = 0; i < particles.length; i++) {
            p = particles[i];

            if (mouse.active) {
                dx = p.x - mouse.x;
                dy = p.y - mouse.y;
                d = Math.sqrt(dx * dx + dy * dy);
                if (d < 150 && d > 0.1) {
                    var push = (1 - d / 150) * (cfg.force / 100) * 1.6;
                    p.vx += (dx / d) * push * 0.32;
                    p.vy += (dy / d) * push * 0.32;
                }
            }

            /* 阻尼，避免被推得太快 */
            p.vx *= 0.985;
            p.vy *= 0.985;

            /* 保持一点基础速度，别全停下 */
            var sp = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
            if (sp < 0.15) {
                var ang = Math.random() * Math.PI * 2;
                p.vx += Math.cos(ang) * 0.08;
                p.vy += Math.sin(ang) * 0.08;
            }
            if (sp > 3.2) {
                p.vx = p.vx / sp * 3.2;
                p.vy = p.vy / sp * 3.2;
            }

            p.x += p.vx * (dt / 16);
            p.y += p.vy * (dt / 16);

            /* 撞墙反弹 */
            if (p.x < 0) { p.x = 0; p.vx = Math.abs(p.vx); }
            if (p.x > W) { p.x = W; p.vx = -Math.abs(p.vx); }
            if (p.y < 0) { p.y = 0; p.vy = Math.abs(p.vy); }
            if (p.y > H) { p.y = H; p.vy = -Math.abs(p.vy); }
        }

        /* 2. 连线（距离越近越亮） */
        var maxD = cfg.linkDist;
        var maxD2 = maxD * maxD;
        var links = 0;

        for (i = 0; i < particles.length; i++) {
            p = particles[i];
            for (j = i + 1; j < particles.length; j++) {
                q = particles[j];
                dx = p.x - q.x;
                dy = p.y - q.y;
                if (dx > maxD || dx < -maxD || dy > maxD || dy < -maxD) continue;

                d = dx * dx + dy * dy;
                if (d > maxD2) continue;

                var ratio = 1 - Math.sqrt(d) / maxD;
                ctx.strokeStyle = 'rgba(96, 165, 250, ' + (ratio * 0.42).toFixed(3) + ')';
                ctx.lineWidth = ratio * 1.15;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(q.x, q.y);
                ctx.stroke();
                links++;
            }
        }

        /* 3. 粒子本身 */
        for (i = 0; i < particles.length; i++) {
            p = particles[i];
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = 'hsla(' + p.hue + ', 95%, 68%, ' + p.alpha + ')';
            ctx.fill();

            /* 靠近鼠标的粒子加个光圈 */
            if (mouse.active) {
                dx = p.x - mouse.x;
                dy = p.y - mouse.y;
                d = Math.sqrt(dx * dx + dy * dy);
                if (d < 130) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r * 2.6, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(79, 209, 255, ' + ((1 - d / 130) * 0.18).toFixed(3) + ')';
                    ctx.fill();
                }
            }
        }

        /* 4. 鼠标处的小圆点 */
        if (mouse.active) {
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, 2.5, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(79, 209, 255, .85)';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, 16, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(79, 209, 255, .22)';
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        document.getElementById('lc').textContent = links;

        if (!cfg.paused) requestAnimationFrame(frame);
    }

    /* ---------- 交互 ---------- */
    cv.addEventListener('mousemove', function (e) {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        mouse.active = true;
    });

    cv.addEventListener('mouseleave', function () {
        mouse.active = false;
        mouse.x = mouse.y = -9999;
    });

    cv.addEventListener('touchmove', function (e) {
        var t = e.touches[0];
        mouse.x = t.clientX;
        mouse.y = t.clientY;
        mouse.active = true;
        e.preventDefault();
    }, { passive: false });

    cv.addEventListener('touchend', function () {
        mouse.active = false;
    });

    /* ---------- 控制面板 ---------- */
    var rCount = document.getElementById('rCount');
    var rDist = document.getElementById('rDist');
    var rSpeed = document.getElementById('rSpeed');
    var rForce = document.getElementById('rForce');

    rCount.addEventListener('input', function () {
        cfg.count = +rCount.value;
        document.getElementById('vCount').textContent = cfg.count;
        initParticles();
    });

    rDist.addEventListener('input', function () {
        cfg.linkDist = +rDist.value;
        document.getElementById('vDist').textContent = cfg.linkDist;
    });

    rSpeed.addEventListener('input', function () {
        cfg.speed = +rSpeed.value / 10;
        document.getElementById('vSpeed').textContent = cfg.speed.toFixed(1);
        /* 立刻把现有粒子的速度按新比例调一下 */
        particles.forEach(function (p) {
            p.vx = p.vx * 0.6 + (Math.random() - 0.5) * cfg.speed * 0.6;
            p.vy = p.vy * 0.6 + (Math.random() - 0.5) * cfg.speed * 0.6;
        });
    });

    rForce.addEventListener('input', function () {
        cfg.force = +rForce.value;
        document.getElementById('vForce').textContent = cfg.force;
    });

    document.getElementById('btnReset').addEventListener('click', function () {
        initParticles();
    });

    var btnPause = document.getElementById('btnPause');
    btnPause.addEventListener('click', function () {
        if (cfg.paused) {
            cfg.paused = false;
            btnPause.textContent = '暂停';
            btnPause.classList.remove('on');
            lastT = 0;
            requestAnimationFrame(frame);
        } else {
            cfg.paused = true;
            btnPause.textContent = '继续';
            btnPause.classList.add('on');
        }
    });

    /* ---------- 启动 ---------- */
    var resizeTimer = null;
    window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
            resize();
            initParticles();
        }, 150);
    });

    resize();
    initParticles();
    requestAnimationFrame(frame);
})();
</script>
</body>
</html>
