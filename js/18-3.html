<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>18-3 基于知识库的智能客服系统架构图（SVG）</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <!--
      作者：lyb
      建立时间：2026-11-05
      使用的大模型：DeepSeek-V4.1-Flash
      功能名称：基于知识库的智能客服系统架构图（纯 SVG 绘制，分层展示在线问答链路、离线知识库建设与模型运维）
    -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            padding: 36px 24px 56px;
            background: #eef1f6;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #1f2329;
        }

        .wrap { max-width: 1280px; margin: 0 auto; }

        .head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }

        h1 { font-size: 24px; font-weight: 600; letter-spacing: .4px; }

        .sub { flex: 1; min-width: 300px; font-size: 13px; line-height: 1.8; color: #6b7484; }

        .acts { display: flex; gap: 8px; }

        .acts button {
            padding: 8px 16px;
            border: 1px solid #d8dee8;
            border-radius: 9px;
            background: #fff;
            font-size: 12.5px;
            color: #3d4653;
            cursor: pointer;
            transition: all .16s;
        }

        .acts button:hover { border-color: #0891b2; color: #0891b2; }

        .acts button.primary { background: #1f2329; border-color: #1f2329; color: #fff; }
        .acts button.primary:hover { background: #000; color: #fff; }

        .board {
            margin-top: 18px;
            background: #fff;
            border: 1px solid #dfe4ec;
            border-radius: 14px;
            padding: 10px;
            box-shadow: 0 6px 24px rgba(31, 35, 41, .05);
        }

        svg#arch { display: block; width: 100%; height: auto; border-radius: 8px; }

        /* SVG 内部文字 */
        .layer-name { font-size: 12.5px; font-weight: 600; }
        .layer-no { font-size: 10.5px; font-family: Consolas, monospace; opacity: .55; }
        .node-title { font-size: 13px; font-weight: 600; fill: #2b3341; }
        .node-title-s { font-size: 12.5px; font-weight: 600; fill: #2b3341; }
        .node-sub { font-size: 10.5px; fill: #8290a3; }
        .proto { font-size: 10.5px; font-family: Consolas, monospace; fill: #8b9bb0; }
        .flow-label { font-size: 11px; font-weight: 600; }
        .caption { font-size: 11.5px; fill: #94a3b8; }

        .node { cursor: default; transition: transform .16s ease; transform-box: fill-box; transform-origin: center; }
        .node:hover { transform: scale(1.035); }
        .node:hover .box { stroke: var(--c); stroke-width: 2; }

        .legend { margin-top: 14px; display: flex; gap: 20px; flex-wrap: wrap; font-size: 12px; color: #6b7484; }
        .legend span { display: inline-flex; align-items: center; gap: 7px; }
        .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

        footer { margin-top: 20px; font-size: 12px; color: #9aa3b2; }
        footer a { color: #5b7fb4; text-decoration: none; }
        footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="head">
        <h1>基于知识库的智能客服系统 · 架构图</h1>
        <p class="sub">
            整张图是 <b>SVG</b>：源码里就是 <code>&lt;rect&gt;</code> / <code>&lt;path&gt;</code> / <code>&lt;text&gt;</code> 这些标签，
            可以任意缩放不失真。左侧是在线问答主链路，右侧是离线知识库建设与模型运维，鼠标悬停任意方块能看它的职责。
        </p>
        <div class="acts">
            <button id="btnSvg">下载 SVG</button>
            <button class="primary" id="btnPng">导出 PNG</button>
        </div>
    </div>

    <div class="board">

<script>
    (function () {
        var svg = document.getElementById('arch');

        /* 下载当前这张 SVG 源文件 */
        document.getElementById('btnSvg').addEventListener('click', function () {
            var src = new XMLSerializer().serializeToString(svg);
            if (src.indexOf('xmlns') === -1) {
                src = src.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
            }
            var head = '<?xml version="1.0" encoding="UTF-8"?>\n';
            /* 把样式内联进去，单独打开 .svg 也能正常显示 */
            var style = '<style>' +
                '.layer-name{font-size:12.5px;font-weight:600;font-family:sans-serif}' +
                '.layer-no{font-size:10.5px;font-family:monospace;opacity:.55}' +
                '.node-title{font-size:13px;font-weight:600;fill:#2b3341;font-family:sans-serif}' +
                '.node-title-s{font-size:12.5px;font-weight:600;fill:#2b3341;font-family:sans-serif}' +
                '.node-sub{font-size:10.5px;fill:#8290a3;font-family:sans-serif}' +
                '.proto{font-size:10.5px;font-family:monospace;fill:#8b9bb0}' +
                '.flow-label{font-size:11px;font-weight:600;font-family:sans-serif}' +
                '.caption{font-size:11.5px;fill:#94a3b8;font-family:sans-serif}' +
                '</style>';
            src = src.replace('</defs>', '</defs>' + style);

            var blob = new Blob([head + src], { type: 'image/svg+xml;charset=utf-8' });
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = '基于知识库的智能客服系统架构图.svg';
            a.click();
            setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
        });

        /* 导出 2 倍分辨率的 PNG，方便直接贴进报告 */
        document.getElementById('btnPng').addEventListener('click', function () {
            var src = new XMLSerializer().serializeToString(svg);
            src = src.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
            var style = '<style>' +
                '.layer-name{font-size:12.5px;font-weight:600;font-family:sans-serif}' +
                '.layer-no{font-size:10.5px;font-family:monospace;opacity:.55}' +
                '.node-title{font-size:13px;font-weight:600;fill:#2b3341;font-family:sans-serif}' +
                '.node-title-s{font-size:12.5px;font-weight:600;fill:#2b3341;font-family:sans-serif}' +
                '.node-sub{font-size:10.5px;fill:#8290a3;font-family:sans-serif}' +
                '.proto{font-size:10.5px;font-family:monospace;fill:#8b9bb0}' +
                '.flow-label{font-size:11px;font-weight:600;font-family:sans-serif}' +
                '.caption{font-size:11.5px;fill:#94a3b8;font-family:sans-serif}' +
                '</style>';
            src = src.replace('</defs>', '</defs>' + style);

            var img = new Image();
            var url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(src);
            img.onload = function () {
                var scale = 2;
                var c = document.createElement('canvas');
                c.width = 1240 * scale;
                c.height = 920 * scale;
                var ctx = c.getContext('2d');
                ctx.fillStyle = '#f8fafc';
                ctx.fillRect(0, 0, c.width, c.height);
                ctx.drawImage(img, 0, 0, c.width, c.height);
                c.toBlob(function (blob) {
                    var a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = '基于知识库的智能客服系统架构图.png';
                    a.click();
                    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
                }, 'image/png');
            };
            img.src = url;
        });
    })();
</script>
